title = "homelab-sysadmin"

[extend]
useDefault = true

[[rules]]
id = "proxmox-api-token"
description = "Token API di Proxmox (utente@realm!nome=uuid)"
regex = '''[\w.-]+@(?:pve|pam)![\w-]+=[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'''
keywords = ["@pve!", "@pam!"]

[[rules]]
id = "password-assegnata"
description = "Password o segreto assegnato in chiaro (env, tfvars, yaml)"
regex = '''(?i)\b[\w]*(?:pass|passwd|password|secret|token|api_key|apikey)\b\s*[:=]\s*["']?([^\s"'<>$]{8,})'''
secretGroup = 1
keywords = ["pass", "secret", "token", "api_key", "apikey"]
[rules.allowlist]
regexTarget = "match"
regexes = [
  # segnaposto e riferimenti al vault di Ansible
  '''(?i)example|changeme|placeholder|vault_|lookup\(''',
  # riferimenti Terraform: api_token = var.pve_api_token
  '''[:=]\s*(?:var|local|each|module|data)\.[\w.\[\]"-]+\s*$''',
]

[allowlist]
description = "File di esempio e file cifrati con ansible-vault"
paths = ['''\.example$''', '''(^|/)vault\.yml$''']
